    license: CC BY 4.0
    shows: episode 379, task_index 10 "put the bowl on the plate" (LIBERO-Goal), frames 0, 35, 65, 111 (global row
      offset 101469 + frame); table camera (column image) and wrist camera (column wrist_image), 256x256 JPG as served
