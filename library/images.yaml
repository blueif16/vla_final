# Images: what we hold, where it came from, and whether we may reuse it. Checked 2026-11-11.
# Rule: reuse a figure only if its paper's licence allows it (CC BY 4.0 here) and credit it in the caption.
# arXiv's default licence (nonexclusive-distrib) does NOT allow reuse: link to the paper or draw our own.
# Local files live in docs/assets/img/ (converted to JPG, max 1600 px wide).

downloaded:
  - file: docs/assets/img/libero-goal.jpg
    source: https://arxiv.org/html/2306.03310v2/figures/libero_goal.png
    paper: LIBERO (Liu et al. 2023), Figure 10 "LIBERO-Goal"
    license: CC BY 4.0
    shows: ten frames of the ten LIBERO-Goal tasks, same table and objects
    used: [ch1 hero]
  - file: docs/assets/img/libero-suites.jpg
    source: https://arxiv.org/html/2306.03310v2/libero_fig1.png
    paper: LIBERO, Figure 1
    license: CC BY 4.0
    shows: the four suites around a globe, plus the five research topics
    note: the panel labels "Different layouts, same objects" / "Different objects, same layout" sit beside the
      LIBERO-Object and LIBERO-Spatial lines in a way that reads swapped against the paper's text; caption it carefully
    used: []
  - file: docs/assets/img/openvla-architecture.jpg
    source: https://arxiv.org/html/2406.09246v3/openvla_model.png
    paper: OpenVLA (Kim et al. 2024), Figure 2
    license: CC BY 4.0
    shows: image + instruction -> DinoV2/SigLIP -> projector -> Llama 2 7B -> action tokens -> de-tokenizer -> 7D action
    used: [ch1 rail two-ways]
  - file: docs/assets/img/oxe-dataset.jpg
    source: https://arxiv.org/html/2310.08864v9/rtx_data_analysis.png
    paper: Open X-Embodiment (2023), Figure 1
    license: CC BY 4.0
    shows: datasets, scenes and trajectories per robot type; common skills and objects
    used: [ch1 rail learning]

