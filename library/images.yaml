    source: same dataset and API as above, frame_index 0 of each episode (checked row by row 2026-11-11)
    license: CC BY 4.0
    shows: first table-camera frame of one run per task. spatial-ep1262 task 31 "pick up the black bowl in the top drawer
      of the wooden cabinet and place it on the plate" (offset 220605); spatial-ep1264 task 32 "... on the ramekin ..."
      (220870); spatial-ep1283 task 38 "... from table center ..." (222995); goal-ep392 task 17 "put the bowl on the
      stove" (103296); goal-ep388 task 16 "turn on the stove" (102876)
    note: first frames of all ten Spatial tasks and three Goal tasks were fetched (episodes and offsets in the
      2026-11-11 session's scratch pick.json, reproduced here for the ones used). By eye the Goal frames show one
      arrangement; the Spatial frames differ, except "on the stove" (ep1267) and "on the wooden cabinet" (ep1290),
      which start from the same arrangement (see papers.yaml code libero-bddl)
    used: [ch1 figure 1.10 (both cases in LIBERO)]

  - files: docs/assets/img/libero-ep379/{table,wrist}-044.jpg
    source: same dataset and API as above, episode 379 frame 44 (global row 101513), fetched 2026-11-11
    license: CC BY 4.0
    shows: 4.4 s into "put the bowl on the plate"; the table camera sees the gripper low over the bowl, the wrist camera
      sees the plate above and the bowl's rim between the fingers. The recorded actions for frames 44-53 (papers.yaml)
      close the gripper at frame 48
    used: []   # drafted for ch2 figure 2.1, then replaced by our own recorded run (pi05-run below)
  - files: docs/assets/img/libero-first/{object-ep851,ten-ep0}.jpg
    source: same dataset and API, frame 0 of episode 851 (row 159975, task 25 "pick up the milk and place it in the
      basket", LIBERO-Object) and of episode 0 (row 0, task 0 "put the white mug on the left plate and put the yellow
      and white mug on the right plate", LIBERO-10); fetched 2026-11-11
    license: CC BY 4.0
    used: [ch2 figure 2.9 (the four suites in the training data)]
  - files: docs/assets/img/pi05-run/call-{00..20}-{table,wrist}.jpg
    source: our own run of openpi's pi05_libero checkpoint on our desktop GPU, 2026-11-11, recorded with openpi's
      preprocessing and settings; originals in stage1/runs/recorded-call-spatial0/call_NN_{table,wrist}.png with calls.json
    license: ours (our own recording of the simulator)
    credit: "our run of openpi's pi05_libero checkpoint, 2026-11-11"
    shows: the two 224x224 pictures exactly as the model received them for each of the 21 calls of LIBERO-Spatial task 0
      ("pick up the black bowl between the plate and the ramekin and place it on the plate"), starting state 0,
      turned 180 degrees and padded as openpi's client does. Call 07 (step 35) is the gripper coming down over a bowl
    converted: PNG 224x224 -> JPG q3 (ffmpeg), same size
    used: [ch2 figure 2.1 (episode player, all 21 calls), ch2 figure 2.3 (call 07), ch2 figure 2.9 (call 07 thumbnails)]
  - file: docs/assets/img/paligemma-architecture.jpg
    source: https://arxiv.org/html/2407.07726v2/PaliGemma_sketch.svg (rendered in headless Chrome at 1748 px, then JPG)
    paper: "PaliGemma (Beyer et al. 2024), Figure 1, captioned 'PaliGemma's architecture: a SigLIP image encoder feeds into a
      Gemma decoder LM' (arXiv abstract page licence CC BY 4.0, checked 2026-11-11)"
    license: CC BY 4.0
    shows: a beach photo -> SigLIP 400M contrastive vision encoder -> linear projection -> image tokens; the question
      "Where is the photographer resting?" -> SentencePiece tokenizer -> text tokens; both into the Gemma 2B transformer
      decoder, which answers "In a hammock under a tree on a tropical beach"
    converted: 1748x872 PNG render -> 1600x798 JPG q3
    used: [ch2 figure 2.2]

