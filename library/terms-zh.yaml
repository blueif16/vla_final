# Chinese names for the glossary's concept terms, shown next to each term on the web pages (glossary.js `zh`) and in
# the 中文 column of docs/learn/glossary.md. Checked 2026-11-11 against Chinese technical writing on VLAs and robot
# learning (sources below). Names (LIBERO, MuJoCo, openpi, Gemma, PaliGemma, SigLIP, Llama 2, RT-2, OpenVLA, π0, π0.5,
# Physical Intelligence, Google DeepMind, Franka Panda, FAST, Open X-Embodiment, LoRA, CAG) stay in Latin letters.
# `open: true` marks a choice where usage really splits; the team picks, and the other forms are listed.

terms:
  neural-network:    { zh: 神经网络 }
  parameters:        { zh: 参数 }
  vla:               { zh: 视觉-语言-动作模型, alt: [视觉语言动作模型], note: "both spellings are common; the hyphens match the English" }
  vlm:               { zh: 视觉-语言模型, alt: [视觉语言模型], note: "视觉语言模型 without hyphens is at least as common; kept hyphenated to match VLA" }
  policy:            { zh: 策略 }
  action:            { zh: 动作 }
  action-chunk:      { zh: 动作块, alt: [动作分块, 动作片段, "action chunk (kept in English)"], open: true,
                       note: "动作块 is the chunk itself and 动作分块 the technique (action chunking); both appear in the pi0 notes below" }
  benchmark:         { zh: 基准测试, alt: [基准, 评测基准], open: true }
  simulator:         { zh: 仿真器, alt: [模拟器, 仿真平台] }
  teleoperation:     { zh: 遥操作, alt: [远程操作] }
  demonstration:     { zh: 演示, alt: [示范, 示教, "demo (kept in English)"], open: true,
                       note: "演示/示范 in ML writing (从演示中学习, 每任务演示数); 示教 comes from industrial robotics (示教数据) and is common in Chinese embodied-AI industry" }
  token:             { zh: 词元, alt: ["token (kept in English, still the most common in practice)", 标记], open: true,
                       note: "全国科学技术名词审定委员会 recommended 词元 for trial use on 2026-03-25; Chinese VLA notes in 2026 still mostly write 动作 token" }
  action-expert:     { zh: 动作专家 }
  diffusion:         { zh: 扩散模型, alt: [扩散], note: "the glossary entry names the method; 扩散 alone reads as the physical process" }
  flow-matching:     { zh: 流匹配 }
  behaviour-cloning: { zh: 行为克隆 }
  pretraining:       { zh: 预训练 }
  fine-tuning:       { zh: 微调 }
  joint-readings:    { zh: 关节状态, alt: [本体感知, 本体状态, 关节角], open: true,
                       note: "'joint readings' is our plain English for state / proprioception; 关节读数 is not a phrase people use. 本体感知(状态) is the usual term in VLA papers" }
  episode:           { zh: 回合, alt: ["episode (kept in English)", 轨迹, 幕], open: true,
                       note: "回合 in RL textbooks and blogs; 幕 in the Chinese translation of Sutton and Barto; dataset write-ups often keep 'episode' or count 轨迹 (recorded runs)" }

  # added for chapter 2 (2026-11-11)
  checkpoint:        { zh: 检查点, alt: ["checkpoint / ckpt (kept in English)", 权重], open: true,
                       note: "检查点 is the textbook word; Chinese VLA write-ups often keep 'checkpoint' (技术栈 KI article: 公开的 π0.5 checkpoint)" }
  attention:         { zh: 注意力, alt: [注意力机制], note: "注意力 for the operation, 注意力机制 for the mechanism; both in the KI write-ups below" }
  image-encoder:     { zh: 图像编码器, alt: [视觉编码器], note: "Hugging Face's Chinese PaliGemma post writes SigLIP 图像编码器; VLA Gallery writes 视觉编码器" }
  patch:             { zh: 图像块, alt: ["patch (kept in English)", 贴片, 图块], open: true,
                       note: "ViT write-ups use 图像块 or keep 'patch'; Hugging Face's Chinese PaliGemma post uses 贴片" }
  gradient:          { zh: 梯度 }
  knowledge-insulation: { zh: 知识隔离, alt: [知识绝缘, "KI / knowledge insulation (kept in English)"],
                       note: "知识隔离 in the 技术栈, cnblogs and CSDN write-ups; 知识绝缘 in Laurie's notes; 具身星图 keeps 'Knowledge Insulation (KI)'" }
  reinforcement-learning: { zh: 强化学习 }

# Terms only in docs/learn/glossary.md (later chapters)
md_only:
  counterfactual-instruction: { zh: 反事实指令 }
  shortcut:                   { zh: 捷径, note: "as in 捷径学习 (shortcut learning)" }
  success-rate:               { zh: 成功率 }
  not_chosen: [grounding, grounding rate, faithful / biased success]

sources:
  - "全国科学技术名词审定委员会, 关于发布试用人工智能领域名词token中文名“词元”的公告, 2026-03-25, http://www.cnterm.cn/news/tzgg/202603/t20260325_827999.html"
  - "Seeed Studio Wiki, π0：流匹配如何连接视觉语言与机器人动作, https://wiki.seeedstudio.com/cn/robotics/paper_reading_pi0/ (动作专家, 流匹配, 动作块, 动作分块)"
  - "具身星图, π0 细读, https://zhuyun97.github.io/embodied-ai-learning/vla/papers/pi0 (视觉-语言模型, 动作专家, 动作块(action chunk), 流匹配)"
  - "LLM Paper Notes, π₀ 原理详解, https://llm-paper-notes.jiabingyang.cn/papers/06-embodied-ai/vla/foundation/pi0_2024.html (本体感知状态)"
  - "技术栈, 《VLA 系列》π0, 2026-08-15, https://jishuzhan.net/article/2088481340340453378 (本体状态, 关节角, 动作 token)"
  - "技术栈, 《VLA 系列》π0.5 + KI | 知识隔离, 2026-08-15, https://jishuzhan.net/article/2088511926266380289 (知识隔离, 注意力, 梯度, checkpoint kept in English)"
  - "clnchanpin, 论文笔记：π0.5 (PI 0.5)KI改进版, 博客园, 2025-11-09, https://www.cnblogs.com/clnchanpin/p/19203767 (知识隔离, 梯度截断, 协同训练)"
  - "v_JULY_v, π0.5的KI改进版——知识隔离, CSDN, 2025-07-10, https://blog.csdn.net/v_JULY_v/article/details/149227640 (知识隔离, 停止梯度)"
  - "Laurie, VLA训练策略 论文笔记, 2025-08-15, https://laurie-hxf.xyz/blog/%E8%AE%BA%E6%96%87vla (知识绝缘)"
  - "具身星图, Knowledge Insulation 细读, https://zhuyun97.github.io/embodied-ai-learning/vla/papers/knowledge-insulation (Knowledge Insulation (KI), 梯度隔离)"
  - "Hugging Face 中文博客, PaliGemma 正式发布, https://huggingface.co/blog/zh/paligemma (SigLIP 图像编码器, 贴片)"
  - "VLA Gallery, π0.5 + KI, https://vla-gallery.is-a.dev/zh/m/pi0-5-ki/ (视觉编码器, 动作专家)"
  - "Embodied AI: Zero to One, LIBERO 与 Ch21 数据集全景, https://estelledc.github.io/embodied-ai-reading-station/ (示范数据采集, 每任务演示数, 遥操作, 基准)"
