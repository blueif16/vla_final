ch4_web_2026_11_13:   # facts read for the chapter 4 web page, 2026-11-13
  - key: libero-cf-ch4
    url: https://arxiv.org/abs/2602.17659 (v3, 2026-11-04) and https://github.com/yuffish/VLA-CF
    facts:
      - "arXiv abstract page licence: CC BY 4.0 (creativecommons.org/licenses/by/4.0, checked 2026-11-13); project page https://vla-cf.github.io/; code repo licence MIT (GitHub API, 2026-11-13)"
      - "Sec. 4 Metrics: 'we define a grounding rate (“grounding”), which measures whether the gripper makes contact with the target object specified in the instruction, regardless of task completion'; success 'measures whether the robot completes the task'"
      - "Sec. 4 Evaluation Dimensions: 'we denote “Faithful” when the model follows the instructed task, and “Biased” when it instead follows the original training task'"
      - "Sec. 4 Suites: CF-Spatial 15 tasks ('targeting original background objects'), CF-Object 10, CF-Long 10, CF-OOD 15 (unseen objects) = 50"
      - "repo README: each task logs a touch rate and a success rate per condition; 'The paper reports results for two of these conditions per task: the instructed (counterfactual) task and the training task. The grounding rate is the touch rate of the corresponding condition.' So grounding and success are each reported faithful and biased"
      - "libero/libero/bddl_files/libero_cf_spatial/01-pick_up_the_cookie_box_and_place_it_on_the_plate.bddl: (:init) identical to LIBERO-Spatial task 0 (bowl_1 between_plate_ramekin_region, bowl_2 next_to_ramekin_region, plate, cookies, ramekin, cabinet, stove), (:language Pick the cookie box and place it on the plate); its (:goal) block still reads (On akita_black_bowl_1 plate_1)"
      - "libero/libero/conditions/libero_cf_spatial.json: every CF-Spatial task watches 'on cookies_1 plate_1', 'on akita_black_bowl_1 plate_1', 'on akita_black_bowl_2 plate_1', 'on glazed_rim_porcelain_ramekin_1 plate_1'; the 15 sentences are cookie box (01, 03, 04, 08, 09), ramekin (02, 05, 06, 11, 15), bowl on the cookie box (07), bowl next to the ramekin (10), bowl next to the plate (12), bowl on the wooden cabinet (13, 14)"
      - "real-robot setup (Fig. 6 caption): Franka Research 3 arm, Robotiq 2F-85 gripper, ZED 2i and ZED mini cameras"
      - "project page videos are self-hosted MP4s (assets/videos/*_pi05.mp4 and *_ours.mp4); none found on YouTube (Exa search, 2026-11-13)"
