        - "docstring: 'We save image observations at 256x256px resolution (instead of 128x128). We filter out transitions with \"no-op\" (zero) actions that do not change the robot's state. We filter out unsuccessful demonstrations. In the LIBERO HDF5 data -> RLDS data conversion (not shown here), we rotate the images by 180 degrees because we observe that the environments return images that are upside down on our platform.'"
        - "is_noop: all action dimensions except the gripper have norm < 1e-4 and the gripper action equals the previous one"
        - "each demo: env.set_init_state(orig_states[0]), then 10 steps of the dummy action, then the original actions replayed with no-ops skipped; saved only 'if done' (the replay reached the goal)"
        - "openvla README: the modified LIBERO datasets (openvla/modified_libero_rlds) were made with this script; openpi's convert_libero_data_to_lerobot.py reads libero_{10,goal,object,spatial}_no_noops (lines 28-33) and writes fps=10"
