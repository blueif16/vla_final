# Papers, code and facts we rely on, with licence and the numbers we have checked. Checked 2026-11-11 unless noted.
# A number goes here only after we read it in the source; the chapters copy numbers from this file.

papers:
  - { key: rt2, title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", authors: "Brohan et al.", year: 2023, arxiv: 2307.15818, license: arxiv-default,
      facts: ["actions written as text tokens, 256 bins per dimension (same discretisation as RT-1)", "backbones PaLI-X and PaLM-E", "co-fine-tuned on web and robot data"] }
  - { key: openvla, title: "OpenVLA: An Open-Source Vision-Language-Action Model", authors: "Kim et al.", year: 2024, arxiv: 2406.09246, license: CC-BY-4.0,
      facts: ["7B parameters", "Llama 2 7B + DinoV2 and SigLIP encoders", "trained on 970k episodes from Open X-Embodiment", "outputs tokenised 7-D actions"] }
  - { key: pi0, title: "pi0: A Vision-Language-Action Flow Model for General Robot Control", authors: "Black et al.", year: 2024, arxiv: 2410.24164, license: arxiv-default,
      facts: ["PaliGemma (Gemma 2B + SigLIP) + ~300M action expert", "flow matching, ~10 integration steps", "50-step action chunks", "~10,000 h of PI robot data + OXE in pretraining",
              "v1 submitted 31 Oct 2024 (arXiv abstract page, checked 2026-11-11)"] }
  - { key: pi05, title: "pi0.5: a Vision-Language-Action Model with Open-World Generalization", authors: "Physical Intelligence", year: 2025, arxiv: 2504.16054, license: arxiv-default,
      facts: ["co-trained on many robots + web data", "predicts a high-level subtask in words, then actions", "aimed at unseen homes",
              "submitted 22 Apr 2025 (arXiv abstract page)",
              "data (Sec. IV-C, HTML v1, checked 2026-11-11): MM ~400 hours of mobile manipulators in ~100 homes; ME non-mobile arms in many homes; CE cross-embodiment lab data, which includes the open-source OXE dataset; HL high-level subtask prediction ('clean the bedroom' -> 'adjust the blanket', 'pick up pillow'); WD web data: captioning (CapsFusion, COCO), question answering (Cambrian-7M, PixMo, VQAv2), object localization; post-training adds VI verbal instructions",
              "'The overwhelming majority of training examples provided to pi0.5 (97.6% during the first training phase) do not come from mobile manipulators performing household tasks'",
              "pre-training with FAST discrete action tokens for 280k gradient steps; post-training adds the action expert (flow matching) for 80k additional steps (Sec. IV-D)"] }
  - { key: ki, title: "Knowledge Insulating Vision-Language-Action Models: Train Fast, Run Fast, Generalize Better", authors: "Driess et al.", year: 2025, arxiv: 2505.23705, license: arxiv-default,
      facts: ["action expert gradients stopped from flowing into the VLM",
              "used in pre-training the pi05 checkpoints; openpi's fine-tuning does NOT implement it, gradients flow through both the action expert and the VLM (Karl Pertsch, openpi issue #649, 2025-09-11/12; checked 2026-11-11). So pi05_libero's 30k-step fine-tune ran without insulation",
              "paper: 'Allowing gradients from the action expert to the backbone (joint-training or pi0) harms language following'; joint training without stop-gradient can still follow language well when VLM data is co-trained (its Fig. 8)",
              "submitted 29 May 2025 (arXiv abstract page)",
              "abstract: 'naively including such experts significantly harms both training speed and knowledge transfer'",
              "Sec. 1: 'fine-tune the VLM backbone with discretized actions while simultaneously adapting an action expert to produce continuous actions ... without propagating its gradients back into the VLM backbone'; the backbone is also co-trained on general vision-language data",
              "PI blog (pi.website/research/knowledge_insulation, 2025-05-28): naively adding an action expert reduced language following; the gradients 'severly interfere with the model's ability to process language'; the method needs 7.5 times fewer training steps than pi0 on the bussing task"] }
  - { key: pistar06, title: "pi*0.6: a VLA That Learns From Experience", year: 2025, arxiv: 2511.14759, license: arxiv-default, facts: ["RECAP; RL from robot experience; Nov 2025", "v1 submitted 18 Nov 2025", "abstract: folds laundry in real homes, assembles boxes, makes espresso; RECAP 'more than doubles task throughput' on some of the hardest tasks"] }
  - { key: fast, title: "FAST: Efficient Action Tokenization for Vision-Language-Action Models", year: 2025, arxiv: 2501.09747, license: CC-BY-4.0, facts: ["DCT + BPE action tokens", "submitted 16 Jan 2025"] }
  - { key: paligemma, title: "PaliGemma: A versatile 3B VLM for transfer", authors: "Beyer et al.", year: 2024, arxiv: 2407.07726, license: CC-BY-4.0,
      facts: ["abstract: based on the SigLIP-So400m vision encoder and the Gemma-2B language model",
              "Fig. 1 caption: 'a SigLIP image encoder feeds into a Gemma decoder LM'; a linear projection maps SigLIP's output tokens to Gemma's token size (Sec. 3)",
              "images resized to a fixed square (224, 448 or 896 px), giving 256, 1024 or 4096 image tokens (Fig. 2 text); 224 px with 14-px patches gives 16 x 16 = 256",
              "prefix-LM: full attention over the image and prefix tokens, autoregressive on the suffix (Fig. 2); '\\n' is the separator token, tokenized separately",
              "licence CC BY 4.0 on the arXiv abstract page, checked 2026-11-11"] }
  - { key: oxe, title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models", year: 2023, arxiv: 2310.08864, license: CC-BY-4.0,
      facts: ["1M+ episodes", "22 embodiments", "RT-1-X ~50% higher mean success than original methods"] }
  - { key: libero, title: "LIBERO: Benchmarking Knowledge Transfer for Lifelong Robot Learning", authors: "Liu et al.", year: 2023, arxiv: 2306.03310, license: CC-BY-4.0,
      facts: ["130 tasks; Spatial, Object, Goal (10 each) and LIBERO-100 (90 + 10)", "robosuite on MuJoCo, Franka Panda", "50 human demonstrations per task", "LIBERO-Goal: same objects and layout, different goals"] }
  - { key: libero-cf, title: "When Vision Overrides Language: Evaluating and Mitigating Counterfactual Failures in VLAs", authors: "Fang et al.", year: 2026, arxiv: 2602.17659, venue: "CoRL 2026 spotlight", code: https://github.com/yuffish/VLA-CF,
      facts: ["Table I pi0.5 success V+L 98.8/98.2/98.0/92.4 (Spatial/Object/Goal/Long), vision-only 68.2/56.6/10.2/71.6, language-only 0.0 everywhere",
              "pi0 vision-only 28.0/26.8/3.4/15.6; OpenVLA-OFT vision-only 83.2/98.2/10.0/85.0",
              "50 counterfactual tasks x 50 trials; grounding rate = gripper contacts the named object; faithful vs biased success",
