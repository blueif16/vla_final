        - "Moo Jin Kim, 2024-10-28: 'For LIBERO, the initial object/robot positions at test time are different from the ones used at train time. Bo Liu (first author of the LIBERO benchmark) confirmed this...'; 'If you load in the initial object/robot states seen in the training demonstrations, you will observe very high success rates'"
