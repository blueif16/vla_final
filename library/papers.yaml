      facts:
        - "default --device spacemouse (also keyboard); --num-demonstration default 50; env built with control_freq=20"
        - "a recording ends by itself once the goal holds: task_completion_hold_count is set to 10 on the first success step, counts down on each further success step and resets if success is lost; the loop breaks at the top after a step when the count reaches 0, so a recording ends 11 steps after the first success step when the goal keeps holding. The code comment: 'state machine to check for having a success for 10 consecutive timesteps'"
        - "pressing the SpaceMouse's reset button returns action None; the try is then not saved (saving=False)"
        - "env.reset() lays out a new arrangement: bddl_base_domain._reset_internal samples every object's place from the task file's regions (placement_initializer.sample())"
    - key: libero-create-dataset
      file: ~/openpi/third_party/libero/scripts/create_dataset.py
      facts:
        - "LIBERO's own HDF5 replays each recording with 128x128 cameras (robot0_eye_in_hand, agentview), control_freq=20, and stores macros.IMAGE_CONVENTION as an attribute"
        - "it skips recording observations for the first 5 steps (cap_index = 5, 'the force sensor is not stable in the beginning'); not used on the page"
    - key: openvla-regenerate
