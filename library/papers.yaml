ch3_web_2026_11_13:   # facts read for the chapter 3 web page, 2026-11-13
  - key: libero-paper-ch3
    url: https://arxiv.org/html/2306.03310v2
    facts:
      - "licence CC BY 4.0 on the arXiv abstract page (rechecked 2026-11-13)"
      - "Sec. 2: each task T^k = (mu_0^k, g^k), an initial state distribution and a goal predicate; sparse reward, R replaced with a goal predicate g: S -> {0,1}"
      - "Sec. 4.1: mu_0 'contains information about object categories and their placement (Figure 2-(A)), and their initial status (Figure 2-(B))'; goals are 'a conjunction of predicates', unary such as Open(X) or TurnOff(X) and binary such as On(A, B) or In(A, B); 'The simulation terminates when all predicates are verified true.'"
      - "Sec. 4.2: 'all tasks in LIBERO-Spatial request the robot to place a bowl, among the same set of objects, on a plate. But there are two identical bowls that differ only in their location or spatial relationship to other objects'; 'All tasks in LIBERO-Goal share the same objects with fixed spatial relations' (the HTML continues 'but differ only in the task goal'); LIBERO-100 split into 90 short-horizon (LIBERO-90) and 10 long-horizon (LIBERO-Long)"
      - "Sec. 4.3: '50 trajectories of high-quality demonstrations for every single task ... collected by human experts through teleoperation with 3Dconnexion Spacemouse'"
      - "Sec. 1, finding 3: 'using pretrained language embeddings of semantically-rich task descriptions yields performance no better than using those of the task IDs' (their own BC policies: ResNet-RNN, ResNet-T, ViT-T; not VLAs)"
      - "Appendix C.1: 'All the figures visualize the goal states of tasks except for Figure 8, which visualizes the initial states since the task goals are always the same'"
  - key: libero-code-ch3
    url: https://github.com/Lifelong-Robot-Learning/LIBERO (openpi's pinned copy at third_party/libero, commit f78abd6, 2023-12-24)
    facts:
      - "README: 'init_states = task_suite.get_task_init_states(task_id) # for benchmarking purpose, we fix the a set of initial states' (sic)"
      - "libero/libero/benchmark/__init__.py: get_task_init_states loads <task>.pruned_init from init_files with torch.load; 50 states per task in the four suites (len checked for Spatial task 0, 2026-11-13)"
      - "libero/libero/envs/bddl_base_domain.py step(): 'done = self._check_success()' after every step; _check_success evaluates the task's goal predicates"
      - "Spatial task 0 file (pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate.bddl): every start region used is 0.02 wide in x and y, e.g. between_plate_ramekin_region (-0.06 0.19 -0.04 0.21); cabinet_region yaw_rotation (2.6613777765410678 2.7242096296128633), a 0.0628 rad span = 3.6 degrees (our conversion; units read as metres and radians, our reading); goal (And (On akita_black_bowl_1 plate_1)). Its own (:language) line reads 'Pick the akita black bowl between the plate and the ramekin and place it on the plate'; the benchmark's sentence comes from the file name"
      - "benchmark task ids vs the HF dataset's task_index (docs/assets/img/ch3/tasks.json vs meta/tasks.jsonl): Spatial pair = benchmark 7 and 9 = dataset 33 and 39; LIBERO-10 pair = benchmark 0 and 1 = dataset 5 and 7"
