code:
  - key: openpi
    url: https://github.com/Physical-Intelligence/openpi
    facts:
      - "pi05_libero results @30k: Spatial 98.8, Object 98.2, Goal 98.0, LIBERO-10 92.4, avg 96.85 (examples/libero/README.md)"
      - "config pi05_libero: from pi05_base, 30,000 steps, batch 256, action_horizon=10, discrete_state_input=False, dataset physical-intelligence/libero, prompt_from_task=True"
      - "pi0.5 adds joint state only as text in the prompt ('Task: ..., State: ...;\\nAction: '); with discrete_state_input=False it gets no state (models/pi0.py, transforms.py)"
      - "eval script examples/libero/main.py: replan_steps=5, num_trials_per_task=50, seed=7, num_steps_wait=10, max steps 220/280/300/520/400 (spatial/object/goal/10/90), images resized to 224"
      - "GPU: inference >8 GB, LoRA fine-tune >22.5 GB (JAX only), full fine-tune >70 GB"
      - "examples/libero/main.py turns both camera images 180 degrees ([::-1, ::-1]) before the model sees them, commented 'IMPORTANT: rotate 180 degrees to match train preprocessing' (checked 2026-11-11). So the physical-intelligence/libero frames are mirrored left-right against the LIBERO paper's figures (cabinet right in the dataset, left in the paper's LIBERO-Goal figure)"
      # Read in a local clone at commit 215abfb (2026-08-24, the latest on GitHub when checked, 2026-11-11):
      - "models/gemma.py: gemma_2b width 2048, depth 18; gemma_300m (the action expert) width 1024, depth 18, commented '311M params'"
      - "models/pi0.py: SigLIP variant 'So400m/14'; models/model.py IMAGE_RESOLUTION = (224, 224), every image resized with resize_with_pad"
      - "three image slots (base_0_rgb, left_wrist_0_rgb, right_wrist_0_rgb); policies/libero_policy.py fills the right-wrist slot with zeros and masks it out for pi0 and pi0.5 (kept only for pi0-FAST)"
      - "pi0_config.py: max_token_len 200 for pi0.5; action_dim 32 (padded); LiberoOutputs returns only the first 7 numbers of each action"
      - "models/tokenizer.py: without discrete state the prompt is <bos> + text + a separately tokenized '\\n'. 'put the bowl on the plate' -> 8 tokens [2, 1065, 573, 14581, 611, 573, 8811, 108] = <bos> put _the _bowl _on _the _plate \\n (PaliGemma tokenizer gs://big_vision/paligemma_tokenizer.model, run 2026-11-11)"
      - "so one pi05_libero call attends to 256 + 256 image tokens + 8 text tokens = 520 prefix tokens; the zeroed third image (256) and 192 padding tokens are masked out; the action expert adds 10 action tokens (our count from the code)"
      - "models/pi0.py sample_actions: num_steps = 10 Euler steps; the prefix (images + text) goes through the network once to fill a KV cache, then the action expert runs once per step against it"
      - "models/pi0.py: pi0.5 has no state token in the action expert's input ('if not self.pi05'), and the tokenizer adds state to the prompt only when discrete_state_input is True; with pi05_libero's False, the state is not used at all"
      - "examples/libero/main.py still sends observation/state = robot0_eef_pos (3) + axis-angle of robot0_eef_quat (3) + robot0_gripper_qpos (2) = 8 numbers; the model drops them"
      - "training/config.py TrainConfig: freeze_filter defaults to nnx.Nothing, so pi05_libero's fine-tune trains every weight; no stop_gradient in models/ (only in utils/fsq_tokenizer.py)"
      - "README Updates: '[Sept 2025] We released PyTorch support in openpi', '[Sept 2025] We released pi05'; README lists only pi0, pi0-FAST and pi0.5 models; PyTorch does not support LoRA training"
      - "public git history starts 2025-02-03 ('Initial commit'); the pi05_libero config arrived in a commit dated 2025-06-30"
      - "pi05_libero config, src/openpi/training/config.py lines 743-763: Pi0Config(pi05=True, action_horizon=10, discrete_state_input=False); LeRobotLiberoDataConfig(repo_id='physical-intelligence/libero', base_config=DataConfig(prompt_from_task=True), extra_delta_transform=False); batch_size=256; CosineDecaySchedule(warmup_steps=10_000, peak_lr=5e-5, decay_steps=1_000_000, decay_lr=5e-5); AdamW(clip_gradient_norm=1.0); ema_decay=0.999; weight_loader CheckpointWeightLoader('gs://openpi-assets/checkpoints/pi05_base/params'); num_train_steps=30_000"
  - key: our-run-spatial0
    url: stage1/runs/recorded-call-spatial0/calls.json (in this repo)
    facts:
      - "our run of openpi's pi05_libero checkpoint on our desktop GPU, 2026-11-11: LIBERO-Spatial task 0 'pick up the black bowl between the plate and the ramekin and place it on the plate', trial 0 (starting state 0), success at step 104"
      - "21 calls at steps 0, 5, ..., 100; each returned 10 actions of 7 numbers, rounded to 4 decimals as the server returned them; the robot ran 5 of each"
      - "action dims: dx, dy, dz, droll, dpitch, dyaw, gripper (-1 open, +1 close)"
      - "gripper in the steps the robot ran: open until step 36, closes at step 37 (call 7, action 3), opens at step 58 (call 11, action 4), closes at step 69 (call 13, action 5), closed to the end; call 6 had put the close at its 10th action, which was not run (our reading of calls.json, 2026-11-11)"
      - "call 0: gripper near -1 in all 10 actions while dx rises from 0.0637 to 0.9388"
      - "the sentence tokenizes to 20 tokens with PaliGemma's tokenizer: <bos> pick _up _the _black _bowl _between _the _plate _and _the _rame kin _and _place _it _on _the _plate \\n ([2, 18075, 908, 573, 2656, 14581, 1865, 573, 8811, 578, 573, 117064, 4074, 578, 2040, 665, 611, 573, 8811, 108]); with two 256-token pictures the model attends to 532 prefix tokens; 180 of the 200 text slots are padding"
  - key: openpi-issue-649
    url: https://github.com/Physical-Intelligence/openpi/issues/649
    facts:
      - "Karl Pertsch (Physical Intelligence), 2025-09-11: 'openpi doesn't currently implement knowledge insulation for finetuning ... openpi finetuning currently only supports finetuning with the action expert flow matching loss and gradients get propagated through *both* the action expert and the VLM backbone'"
      - "2025-09-12: 'Indeed, we use KI during pre-training for the pi05 checkpoints.' Freezing the whole VLM during fine-tuning 'likely will work a lot worse'; no conclusive evidence yet that KI helps during fine-tuning (read 2026-11-11)"
