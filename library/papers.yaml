      - "v3 suites: CF-Spatial 15 tasks, CF-Object 10, CF-Long 10, CF-OOD 15 (50 in all); 50 trials per task (App. B.1); grounding rate = gripper contacts the target object named, regardless of completion; Faithful = followed the instructed task, Biased = followed the original training task"
      - "Table 3 (v3), pi0.5 Average column: grounding F 30.8 / B 65.6 baseline, TF 40.5 / 59.8, VA 46.3 / 52.2; success F 13.2 / B 60.9 baseline, TF 16.8 / 43.5, VA 21.7 / 36.2. So TF-CAG +9.7 grounding, +3.6 success; VA-CAG +15.5 / +8.5 (abstract)"
      - "Table 2: removing the training-task object (CF-Focused vs CF-Spatial), average over three VLAs: grounding 39.0 -> 64.4, success 20.0 -> 40.0; pi0.5 grounding 39.3 -> 68.5, success 24.4 -> 54.4"
      - "CAG rule, eq. 2 (v3): a_CAG = a_uncond + omega * (a_cond - a_uncond), omega >= 0, applied to the final predicted action chunks; 'Inspired by classifier-free guidance'; omega = 1.5 for pi0 and pi0.5, 3.0 for OpenVLA-OFT (Sec. 6.2). TF uses the same VLA with the language dropped as the unconditioned branch; VA trains a separate vision-action model on LIBERO with the language input dropped"
      - "Figure 4 (guidance scale, pi0.5): grounding 39.3/50.7/56.8/58.4 and success 24.4/31.6/28.8/16.4 at omega 1.0/1.5/2.0/3.0; OpenVLA-OFT grounding 6.8/11.6/18.4/26.5/30.4 and success 1.1/2.9/5.9/7.9/4.1 at 1.0/1.5/2.0/3.0/4.0. The pi0.5 values at 1.0 and 1.5 equal Table 3's CF-Spatial baseline and VA rows (our reading)"
      - "Figure 2(a): grasp heat maps from 50 trials of pi0.5 on CF-Spatial; with no instruction the distribution 'still primarily centers on the training-task object'"
      - "real robot (Sec. 7): Franka Research 3, Robotiq 2F-85, DROID-style cameras; 20 demonstrations for the in-domain task and 1 for each under-observed task per scene; pi0.5-DROID fine-tuned 10k steps, batch 32; 10 trials per instruction; VA-CAG +9.4 grounding, +17.2 success on average (abstract). Latency per 15-step chunk: pi0.5 80.0 ms, TF-CAG 126.6 ms (1.6x), VA-CAG 132.6 ms (1.7x) (Table 6)"
