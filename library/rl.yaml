# Sources for the reinforcement-learning series (docs/learn/rl-*.md). All checked 2026-11-13 unless noted.
# A number goes here only after we read it in the source; the chapters copy numbers from this file.
# `quote` is copied from the source. `caveat` is what a reader of the quote could get wrong.

classic:
  - { key: thorndike, what: "law of effect", source: "Thorndike (1911), Animal Intelligence, p. 244 (puzzle boxes 1898)", url: https://archive.org/details/cu31924003032954,
      quote: "Of several responses made to the same situation, those which are accompanied or closely followed by satisfaction to the animal will, other things being equal, be more firmly connected with the situation" }
  - { key: bellman, what: "Dynamic Programming, Princeton University Press, 1957; the Bellman equation", source: "Sutton and Barto 2nd ed. sec. 1.7", url: http://incompleteideas.net/book/RLbook2020.pdf }
  - { key: sutton-barto, what: "Reinforcement Learning: An Introduction, 1st ed. 1998, 2nd ed. 2018, free online", url: http://incompleteideas.net/book/the-book-2nd.html }
  - { key: td, what: "Sutton (1988), Learning to predict by the methods of temporal differences, Machine Learning 3", url: https://link.springer.com/article/10.1007/BF00115009,
      quote: "the new methods assign credit by means of the difference between temporally successive predictions" }
  - { key: q-learning, what: "Watkins (1989) PhD thesis 'Learning from Delayed Rewards', Cambridge; Watkins and Dayan (1992), Machine Learning 8(3-4):279-292", url: https://link.springer.com/article/10.1007/BF00992698 }
